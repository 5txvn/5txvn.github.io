      var bgMusic = null;

      // Wallpaper options for Settings (add your PNG/JPG filenames here; paths relative to images/)
      var WALLPAPER_OPTIONS = ['bg.png', 'bg-test.png', 'wallpaper.png', 'wallpaper-alt.jpg'];

      // Stop-motion background: sequential frames (add more paths as needed)
      var BG_LIGHT = ['images/bg-light-1.png', 'images/bg-light-2.png'];
      var BG_DARK = ['images/bg-dark-1.png', 'images/bg-dark-2.png'];
      var BACKGROUND_INTERVAL_MS = 500;
      var backgroundIntervalId = null;
      var bgLightIndex = 0;
      var bgDarkIndex = 0;
      var backgroundPreloaded = false;

      function preloadBackgrounds(callback) {
        var all = BG_LIGHT.concat(BG_DARK);
        if (all.length === 0) { callback(); return; }
        var loaded = 0;
        function onLoad() {
          loaded++;
          if (loaded >= all.length) { backgroundPreloaded = true; callback(); }
        }
        for (var i = 0; i < all.length; i++) {
          var img = new Image();
          img.onload = onLoad;
          img.onerror = onLoad;
          img.src = all[i];
        }
      }

      function setDesktopWallpaperFromArray() {
        var isDark = $('body').hasClass('dark-mode');
        var arr = isDark ? BG_DARK : BG_LIGHT;
        if (!arr.length) return;
        var idx = isDark ? bgDarkIndex : bgLightIndex;
        var url = arr[idx];
        
        var img = new Image();
        img.onload = function () {
          $('#desktop-wallpaper').css('background-image', "url('" + url + "')");
        };
        img.src = url;

        if (isDark) {
          bgDarkIndex = (bgDarkIndex + 1) % arr.length;
        } else {
          bgLightIndex = (bgLightIndex + 1) % arr.length;
        }
      }

      function startBackgroundRotation() {
        if (backgroundIntervalId) clearInterval(backgroundIntervalId);
        if (!backgroundPreloaded) {
          preloadBackgrounds(function () {
            setDesktopWallpaperFromArray();
            backgroundIntervalId = setInterval(setDesktopWallpaperFromArray, BACKGROUND_INTERVAL_MS);
          });
          return;
        }
        setDesktopWallpaperFromArray();
        backgroundIntervalId = setInterval(setDesktopWallpaperFromArray, BACKGROUND_INTERVAL_MS);
      }

      // Projects: url and title for browser(); notepad has "Have a peek" link.
      var PROJECTS = {

        dxdy:          { title: 'dxdy',           url: 'https://dxdy-m2c7.onrender.com', icon: 'calculator.png' },
        slink:         { title: 'Slink',          url: 'https://sem-link.org',          icon: 'slink.png' },
        knowurschist:  { title: 'KnowUrSchist',   url: 'https://5txvn.github.io/knowurschist', icon: 'petri-dish.png' }
      };

      function getNotepadCaretLineCol(editableEl) {
        var sel = window.getSelection();
        if (!sel.rangeCount) return { line: 1, col: 1 };
        try {
          var range = sel.getRangeAt(0).cloneRange();
          range.selectNodeContents(editableEl);
          range.setEnd(sel.anchorNode, sel.anchorOffset);
          var text = range.toString();
          var lines = text.split('\n');
          return { line: Math.max(1, lines.length), col: (lines[lines.length - 1] || '').length + 1 };
        } catch (e) { return { line: 1, col: 1 }; }
      }

      function initNotepad($win) {

        var defaultHtml = $editor.html();

        function updateStatus() {
          var el = $editor[0];
          var text = (el.innerText || el.textContent || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
          var total = text.length;
          var lc = getNotepadCaretLineCol(el);
          $lnCol.text('Ln ' + lc.line + ', Col ' + lc.col);
          $chars.text(total.toLocaleString() + ' character' + (total !== 1 ? 's' : ''));
        }

        function moveCaretToEnd() {
          var el = $editor[0];
          var sel = window.getSelection();
          var range = document.createRange();
          range.selectNodeContents(el);
          range.collapse(false);
          sel.removeAllRanges();
          sel.addRange(range);
          updateStatus();
        }

        $editor.on('input', updateStatus);
        $win.data('notepad-initial-focus-done', false);
        setTimeout(function () {
          if ($win.data('notepad-initial-focus-done')) return;
          $win.data('notepad-initial-focus-done', true);
          $editor[0].focus();
          moveCaretToEnd();
        }, 50);
        document.addEventListener('selectionchange', function () {
          if ($editor[0] && document.activeElement === $editor[0]) updateStatus();
        });
        updateStatus();

        $win.find('.notepad-bold').on('click', function (e) {
          e.preventDefault();
          $editor[0].focus();
          document.execCommand('bold', false, null);
        });
        $win.find('.notepad-italic').on('click', function (e) {
          e.preventDefault();
          $editor[0].focus();

        function restoreContent() {

          $win.addClass('hidden');
        });
      }

          $new.removeClass('rounded-t-lg').addClass('maximized rounded-none');
          $new[0].style.position = 'fixed';
          $new.css({ left: '0', top: '0', right: '0', bottom: TASKBAR_H + 'px', width: '100%', height: '', minHeight: '', marginLeft: '0', marginTop: '0' });
          $new.find('.window-titlebar').css('cursor', 'default');
          $new.find('.window-resize-e, .window-resize-s, .window-resize-se').css('pointer-events', 'none');
        }
        if (id === 'welcome') initCmdInput($new);
        if (id === 'settings') initSettings($new);
        if (id === 'calculator') initCalculator($new);
        if (id === 'paint') initPaint($new);
        if ($new.find('.notepad-editor').length) initNotepad($new);
        if ($new.find('.window-menubar .menu-item').length) bindMenuItems($new);
      }

      function initSettings($win) {
        var $tiles = $win.find('.settings-wallpaper-tiles');
        $tiles.empty();
        WALLPAPER_OPTIONS.forEach(function (filename) {
          var path = 'images/' + filename;
          var $tile = $('<div class="settings-wallpaper-tile rounded border-2 border-slate-300 overflow-hidden cursor-pointer hover:border-blue-500 bg-slate-200 aspect-video flex-shrink-0" data-wallpaper="' + path + '" title="' + filename + '"></div>');
          $tile.css('background-image', 'url(' + path + ')').css('background-size', 'cover').css('background-position', 'center');
          $tile.on('click', function () {
            var p = $(this).data('wallpaper');
            $('#desktop-wallpaper, #login-wallpaper').css('background-image', "url('" + p + "')");
            try { localStorage.setItem('portfolio-wallpaper', p); } catch (err) {}
            $win.find('.settings-wallpaper-tile').removeClass('border-blue-500').css('border-color', '');
            $(this).addClass('border-blue-500').css('border-color', 'rgb(59 130 246)');
          });
          $tiles.append($tile);
        });
        $win.find('.settings-nav-item').on('click', function () {
          $win.find('.settings-nav-item').removeClass('text-slate-800 settings-nav-active').addClass('text-slate-600');
          $(this).removeClass('text-slate-600').addClass('text-slate-800 settings-nav-active');
          var page = $(this).data('settings-page');
          if (page === 'home') {
            $win.find('.settings-page').addClass('hidden');
            $win.find('.settings-page[data-page="home"]').removeClass('hidden');
          }
        });
        var $homePreview = $win.find('#settings-home-wallpaper-preview');
        if ($homePreview.length) {
          var previewUrl = $('#desktop-wallpaper').css('background-image');
          if (previewUrl && previewUrl !== 'none') $homePreview.css('background-image', previewUrl);
        }
        setTimeout(function () { $win.find('.settings-search').focus(); }, 100);
      }

      function initCalculator($win) {
        var $display = $win.find('[data-display]');
        function setDisplay(s) { $display.text(s || '0'); }
        var current = '0', prev = null, op = null;
        $win.find('.calc-btn').on('click', function () {
          var v = $(this).data('calc');
          if (v === 'C' || v === 'CE') { current = '0'; prev = null; op = null; setDisplay('0'); return; }
          if (v === 'back') {
            if (current.length <= 1) current = '0'; else current = current.slice(0, -1);
            setDisplay(current);
            return;
          }
          if (v === '=') {
            if (prev !== null && op) {
              var a = parseFloat(prev), b = parseFloat(current);
              if (op === '+') current = (a + b).toString();
              else if (op === '-') current = (a - b).toString();
              else if (op === '*') current = (a * b).toString();
              else if (op === '/') current = b !== 0 ? (a / b).toString() : 'Error';
              prev = null; op = null;
              setDisplay(current);
            }
            return;
          }
          if (v === '%') { var n = parseFloat(current); current = (n / 100).toString(); setDisplay(current); return; }
          if (v === '1/x') { var x = parseFloat(current); current = x !== 0 ? (1 / x).toString() : 'Error'; setDisplay(current); return; }
          if (v === 'x2') { var y = parseFloat(current); current = (y * y).toString(); setDisplay(current); return; }
          if (v === 'sqrt') { var z = parseFloat(current); current = z >= 0 ? Math.sqrt(z).toString() : 'Error'; setDisplay(current); return; }
          if (v === 'neg') { if (current !== '0') current = current.startsWith('-') ? current.slice(1) : '-' + current; setDisplay(current); return; }
          if (v === '+' || v === '-' || v === '*' || v === '/') { prev = current; op = v; current = '0'; setDisplay(current); return; }
          if (v === '.') { if (current.indexOf('.') === -1) current += '.'; setDisplay(current); return; }
          if (current === '0' && v !== '0') current = v; else if (current !== '0' || v !== '0') current += v;
          setDisplay(current);
        });
      }

      function initPaint($win) {
        var canvas = $win.find('.paint-canvas')[0];
        if (!canvas) return;
        var ctx = canvas.getContext('2d');
        var drawing = false, lastX, lastY;
        var color = '#000000';
        $win.find('.paint-color').on('input', function () { color = $(this).val(); });
        $win.find('.paint-clear').on('click', function () { ctx.clearRect(0, 0, canvas.width, canvas.height); });
        function draw(x, y) { ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(x, y); ctx.stroke(); lastX = x; lastY = y; }
        $win.find('.paint-canvas').on('mousedown', function (e) {
          drawing = true;
          var r = canvas.getBoundingClientRect();
          var s = canvas.width / r.width;
          lastX = (e.clientX - r.left) * s; lastY = (e.clientY - r.top) * s;
          $(document).on('mousemove.paint', function (e2) {
            if (!drawing || !canvas) return;
            var r2 = canvas.getBoundingClientRect();
            var s2 = canvas.width / r2.width;
            var x = (e2.clientX - r2.left) * s2, y = (e2.clientY - r2.top) * s2;
            draw(x, y);
          });
          $(document).on('mouseup.paint', function () { drawing = false; $(document).off('mousemove.paint mouseup.paint'); });
        });
      }

      function initCmdInput($win) {
        var $body = $win.find('.window-body');
        var $output = $win.find('.cmd-output');
        var $input = $win.find('.cmd-input');
        function getInputLine() { return $win.find('.cmd-input-line').last(); }
        function getTyped() { return $win.find('.cmd-typed').last(); }
        $input.off('keydown input').on('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            var $inputLine = getInputLine();
            var $typed = $inputLine.find('.cmd-typed');
            var rawLine = ($typed.text() || '').trim();
            var line = rawLine.toLowerCase();
            var promptHtml = '<span class="text-slate-300">C:\\Users\\Portfolio&gt;</span> ';
            $inputLine.replaceWith(escapeHtml(rawLine || '') + '<br>');
            if (line === 'help') {
              $output.append('<span class="text-white">fullscreen - Put the page in fullscreen</span><br>');
              $output.append('<span class="text-white">help - Show this list of commands</span><br>');
              $output.append('<span class="text-white">settings - Open Settings</span><br>');
              $output.append('<span class="text-white">calculator - Open Calculator</span><br>');
              $output.append('<span class="text-white">paint - Open Paint</span><br>');
              $output.append('<span class="text-white">edge - Open browser (project links only)</span><br>');
            } else if (line === 'fullscreen') {
              var doc = document.documentElement;
              if (!document.fullscreenElement) doc.requestFullscreen().catch(function() {});
              else if (document.exitFullscreen) document.exitFullscreen();
            } else if (line === 'settings' || line === 'calculator' || line === 'paint') {
              openWindow(line);
            } else if (line === 'edge') {
              browser(null, 'Edge');
            }
            $output.append(promptHtml + '<span class="cmd-input-line inline-flex items-baseline"><span class="cmd-typed"></span><span class="cmd-cursor inline-block w-px h-4 ml-0.5 align-middle bg-white" style="animation: blink 1s step-end infinite;"></span></span>');
            $body.scrollTop($body[0].scrollHeight);
            return;
          }
          if (e.key === 'Backspace') {
            e.preventDefault();
            var $t = getTyped();
            $t.text($t.text().slice(0, -1));
            return;
          }
        }).on('input', function () {
          var v = $input.val();
          $input.val('');
          var $t = getTyped();
          $t.text($t.text() + v);
        });
        $body.on('click', function () { $input[0].focus(); });
        setTimeout(function () { $input[0].focus(); }, 100);
      }
      function escapeHtml(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

      function bindMenuItems($win) {
        $win.find('.window-menubar .menu-item').on('click', function (e) {
          e.stopPropagation();
          var $btn = $(this);
          var label = $btn.text().trim();
          var $drop = $win.find('.menu-dropdown');
          if ($drop.length) $drop.remove();
          var items = { File: ['New', 'Open', 'Save', 'Exit'], Edit: ['Undo', 'Cut', 'Copy', 'Paste'], Format: ['Font', 'Word Wrap'], View: ['Zoom', 'Status Bar'], Help: ['View Help', 'About'] };
          var list = items[label] || ['(empty)'];
          var $ul = $('<ul class="menu-dropdown bg-white border border-slate-300 rounded shadow-lg py-1 min-w-[120px] absolute z-[100]"></ul>');
          list.forEach(function (item) { $ul.append('<li class="px-3 py-1.5 hover:bg-slate-100 cursor-pointer text-sm text-slate-700">' + item + '</li>'); });
          $win.append($ul);
          var top = $btn.offset().top - $win.offset().top + 24;
          var left = $btn.offset().left - $win.offset().left;
          $ul.css({ top: top + 'px', left: left + 'px' });
          $(document).one('click', function () { $ul.remove(); });
        });
      }

      function bringToFront($win) {
        $win.css('zIndex', zIndex++);
      }

      function makeDraggable($win) {
        var $bar = $win.find('.window-titlebar');
        var dragging = false, ox, oy, startLeft, startTop;
        function getCoords(e) {
          if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
          return { x: e.clientX, y: e.clientY };
        }
        function startDrag(e) {
          if ($(e.target).closest('button').length) return;
          if ($win.hasClass('maximized')) return;
          e.preventDefault();
          var c = getCoords(e);
          dragging = true;
          ox = c.x;
          oy = c.y;
          var r = $win[0].getBoundingClientRect();
          var areaRect = $area[0].getBoundingClientRect();
          startLeft = r.left - areaRect.left;
          startTop = r.top - areaRect.top;
          bringToFront($win);
          $win[0].style.transition = 'none';
        }
        function moveDrag(e) {
          if (!dragging) return;
          var c = getCoords(e);
          var dx = c.x - ox, dy = c.y - oy;
          $win.css({ left: (startLeft + dx) + 'px', top: (startTop + dy) + 'px', right: '', bottom: '', marginLeft: '', marginTop: '' });
        }
        function endDrag() {
          dragging = false;
          $win[0].style.transition = '';
        }
        $bar.on('mousedown', startDrag);
        $bar.on('touchstart', startDrag, { passive: false });
        $(document).on('mousemove', function (e) {
          if (!dragging) return;
          var dx = e.clientX - ox, dy = e.clientY - oy;
          $win.css({ left: (startLeft + dx) + 'px', top: (startTop + dy) + 'px', right: '', bottom: '', marginLeft: '', marginTop: '' });
        });
        $(document).on('touchmove', function (e) {
          if (!dragging) return;
          e.preventDefault();
          var c = getCoords(e);
          var dx = c.x - ox, dy = c.y - oy;
          $win.css({ left: (startLeft + dx) + 'px', top: (startTop + dy) + 'px', right: '', bottom: '', marginLeft: '', marginTop: '' });
        }, { passive: false });
        $(document).on('mouseup', endDrag);
        $(document).on('touchend', endDrag);
      }

      function makeResizable($win) {
        function doResize(edge, e) {
          e.preventDefault();
          var el = $win[0];
          el.style.transition = 'none';
          el.style.maxWidth = 'none';
          var r = el.getBoundingClientRect();
          var startX = e.clientX, startY = e.clientY;
          var startW = r.width, startH = r.height;
          var cursor = (edge === 'se') ? 'nwse-resize' : (edge === 'e') ? 'ew-resize' : 'ns-resize';
          document.body.style.cursor = cursor;
          document.body.style.userSelect = 'none';
          function onMove(e2) {
            e2.preventDefault();
            if (edge === 'e' || edge === 'se') {
              var newW = Math.max(320, startW + (e2.clientX - startX));
              el.style.width = newW + 'px';
            }
            if (edge === 's' || edge === 'se') {
              var newH = Math.max(200, startH + (e2.clientY - startY));
              el.style.minHeight = newH + 'px';
              el.style.height = newH + 'px';
            }
          }
          function onUp() {
            $(document).off('mousemove.resize mouseup.resize');
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
            el.style.transition = '';
          }
          $(document).on('mousemove.resize', onMove);
          $(document).on('mouseup.resize', onUp);
        }
        $win.find('.window-resize-e').on('mousedown', function (e) { if (!$win.hasClass('maximized')) doResize('e', e); });
        $win.find('.window-resize-s').on('mousedown', function (e) { if (!$win.hasClass('maximized')) doResize('s', e); });
        $win.find('.window-resize-se').on('mousedown', function (e) { if (!$win.hasClass('maximized')) doResize('se', e); });
      }

      function bindWindowButtons($win) {
        $win.find('.window-close').on('click', function () {
          if ($win.attr('data-window-id') === 'about') aboutClosedOnce = true;
          var $editor = $win.find('.notepad-editor');
          if ($editor.length && $win.data('notepad-default') != null) {
            $editor.html($win.data('notepad-default'));
            var id = $win.attr('data-window-id');
            if (PROJECTS[id]) {
              $win.find('.project-open-link').off('click').on('click', function (e) { e.preventDefault(); var u = $(this).attr('href'); if (u && u !== '#') window.open(u, '_blank'); });
            }
          }
          $win.addClass('hidden');
        });
        $win.find('.window-minimize').on('click', function () {
          $win.css('transition', 'opacity 0.15s ease, transform 0.15s ease');
          $win.css({ opacity: '0', transform: 'scale(0.95)' });
          setTimeout(function () {
            $win.addClass('hidden').css({ opacity: '', transform: '', transition: '' });
          }, 150);
        });
        $win.find('.window-maximize').on('click', function () {
          if ($win.hasClass('maximized')) {
            $win.removeClass('maximized rounded-none').addClass('rounded-t-lg');
            var prev = $win.data('prevBounds');
            if (prev) {
              $win[0].style.position = 'absolute';
              $win.css({ left: prev.left, top: prev.top, right: '', bottom: '', width: prev.width || '', height: '', minHeight: prev.minHeight || '', marginLeft: prev.marginLeft || '', marginTop: prev.marginTop || '' });
            }
            $win.find('.window-titlebar').css('cursor', 'move');
            $win.find('.window-resize-e, .window-resize-s, .window-resize-se').css('pointer-events', '');
          } else {
            $win.data('prevBounds', {
              left: $win.css('left'),
              top: $win.css('top'),
              width: $win.css('width'),
              minHeight: $win.css('minHeight'),
              marginLeft: $win.css('marginLeft'),
              marginTop: $win.css('marginTop')
            });
            $win.removeClass('rounded-t-lg').addClass('maximized rounded-none');
            $win[0].style.position = 'fixed';
            $win.css({
              left: '0',
              top: '0',
              right: '0',
              bottom: TASKBAR_H + 'px',
              width: '100%',
              height: '',
              minHeight: '',
              marginLeft: '0',
              marginTop: '0'
            });
            $win.find('.window-titlebar').css('cursor', 'default');
            $win.find('.window-resize-e, .window-resize-s, .window-resize-se').css('pointer-events', 'none');
          }
        });
      }

      // Taskbar: single click opens / focuses window (GitHub/Resume/LinkedIn open in new tab)
      $('.taskbar-app').on('click', function () {
        var id = $(this).data('window');
        if (id === 'github') { window.open(GITHUB_URL, '_blank'); return; }
        if (id === 'resume') { openWindow(id); return; }
        if (id === 'linkedin') { window.open(LINKEDIN_URL, '_blank'); return; }
        openWindow(id);
        var $win = $area.find('[data-window-id="' + id + '"]').last();
        if ($win.length && $win.hasClass('hidden')) $win.removeClass('hidden');
        if ($win.length) bringToFront($win);
      });

      // Start menu: show on click of Windows button; hide on outside click
      $('#start-btn').on('click', function (e) {
        e.stopPropagation();
        $('#start-menu').toggleClass('start-menu-closed');
      });
      $('#start-menu').on('click', function (e) { e.stopPropagation(); });
      $(document).on('click', function () { $('#start-menu').addClass('start-menu-closed'); $('#calendar-popover').addClass('hidden'); });
      $('.start-menu-item').on('click', function () {
        var id = $(this).data('window');
        if (id === 'github') { window.open(GITHUB_URL, '_blank'); $('#start-menu').addClass('start-menu-closed'); return; }
        if (id === 'resume') { openWindow(id); $('#start-menu').addClass('start-menu-closed'); return; }
        if (id === 'linkedin') { window.open(LINKEDIN_URL, '_blank'); $('#start-menu').addClass('start-menu-closed'); return; }
        if (id === 'edge') { browser(null, 'Edge'); $('#start-menu').addClass('start-menu-closed'); return; }
        openWindow(id);
        $('#start-menu').addClass('start-menu-closed');
      });

      // System tray: volume tooltip only; wifi/battery have no tooltips
      $('#tray-volume').on('click', function (e) {
        e.stopPropagation();
        var $pop = $('#volume-popover');
        $pop.toggleClass('hidden');
        if (!$pop.hasClass('hidden') && bgMusic) {
          var pct = Math.round((bgMusic.volume || 0.7) * 100);
          $('#volume-slider').val(pct);
          $('#volume-pct').text(pct + '%');
        }
      });
      $(document).on('click', function () { $('#volume-popover').addClass('hidden'); });
      $('#volume-popover').on('click', function (e) { e.stopPropagation(); });
      $('#volume-slider').on('input', function () {
        var v = parseInt($(this).val(), 10) / 100;
        if (bgMusic) bgMusic.volume = v;
        $('#volume-pct').text(Math.round(v * 100) + '%');
      });

      // Calendar popover: Windows-style; above taskbar; red highlight; no time at bottom
      function fillCalendarPopover() {
        var now = new Date();
        var months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        $('#calendar-month').text(months[now.getMonth()] + ' ' + now.getFullYear());
        var first = new Date(now.getFullYear(), now.getMonth(), 1);
        var last = new Date(now.getFullYear(), now.getMonth() + 1, 0);
        var startDay = first.getDay();
        var days = last.getDate();
        var html = '<span class="font-medium text-slate-400">Su</span><span class="font-medium text-slate-400">Mo</span><span class="font-medium text-slate-400">Tu</span><span class="font-medium text-slate-400">We</span><span class="font-medium text-slate-400">Th</span><span class="font-medium text-slate-400">Fr</span><span class="font-medium text-slate-400">Sa</span>';
        for (var i = 0; i < startDay; i++) html += '<span></span>';
        for (var d = 1; d <= days; d++) {
          var cls = d === now.getDate() ? 'calendar-day-today w-8 h-8 flex items-center justify-center mx-auto' : 'w-8 h-8 flex items-center justify-center mx-auto';
          html += '<span class="' + cls + '">' + d + '</span>';
        }
        $('#calendar-grid').html(html);
      }
      $('#tray-time').on('click', function (e) {
        e.stopPropagation();
        var $cal = $('#calendar-popover');
        if ($cal.hasClass('hidden')) { fillCalendarPopover(); $cal.removeClass('hidden'); } else { $cal.addClass('hidden'); }
      });
      $('#calendar-popover').on('click', function (e) { e.stopPropagation(); });

      // --- Clock (top, 09:36 AM) & date (bottom, 3/3/2026) - same size, right aligned ---
      function updateClock() {
        var now = new Date();
        var h = now.getHours(), m = now.getMinutes();
        var ampm = h >= 12 ? 'PM' : 'AM';
        h = h % 12 || 12;
        $('#clock').text((h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m + ' ' + ampm);
        $('#date').text((now.getMonth() + 1) + '/' + now.getDate() + '/' + now.getFullYear());
      }
      updateClock();
      setInterval(updateClock, 1000);
    });
  </script>
